<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>College Tracker</title>
<style>
:root{--bg:#f8f7f3;--paper:#fffefa;--ink:#25332f;--muted:#757a76;--line:#dddfd8;--sage:#e6ece2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{touch-action:manipulation}
button{cursor:pointer;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:10px 15px}
button:hover{background:var(--sage)}
button.primary{background:var(--ink);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #91a487;outline-offset:3px}
header{border-bottom:1px solid var(--line);background:var(--paper)}
.bar{max-width:1400px;margin:auto;padding:25px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
h1{font:36px Georgia,serif;margin:0}
h2{font:24px Georgia,serif;margin:0}
nav{display:flex;gap:25px;flex-wrap:wrap}
nav button{border:0;border-radius:0;background:transparent;padding:12px 0;color:var(--muted)}
nav button.active{color:var(--ink);border-bottom:2px solid var(--ink)}
main{max-width:1400px;margin:auto;padding:32px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px}
.stat{border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:24px}
.stat span{color:var(--muted)}
.stat strong{display:block;font:36px Georgia,serif;margin-top:9px}
.panel{border:1px solid var(--line);border-radius:7px;background:var(--paper);overflow:hidden}
.toolbar,.panelhead{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
input:not([type=checkbox]),select,textarea{padding:11px 13px;background:transparent;border:1px solid var(--line);border-radius:5px;width:100%}
.toolbar input{max-width:360px}
.toolbar select{width:auto;max-width:100%}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;text-align:left}
th{font-weight:500;color:#52605b;background:#f4f4ef}
th,td{padding:18px 22px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
td{vertical-align:middle}
.school{font-weight:600}
small{display:block;color:var(--muted);margin-top:4px}
.badge{display:inline-block;background:var(--sage);border-radius:20px;padding:5px 10px;font-size:12px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:65px 24px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
.list{padding:0 22px}
.item{display:flex;align-items:center;gap:12px;padding:18px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.item input{width:18px;height:18px;accent-color:#65755c}
.done{text-decoration:line-through;color:var(--muted)}
.late{color:#a15142}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.icon{padding:7px 11px}
footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
#notice{color:#a15142;margin-bottom:12px}
dialog{width:min(520px,94vw);max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:26px;background:var(--paper)}
dialog::backdrop{background:#20292375}
label{display:block;font-size:13px;margin:16px 0 6px}
textarea{min-height:90px;resize:vertical}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.notes{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:760px){
.bar,main{padding:20px}h1{font-size:29px}
nav{order:3;width:100%;gap:22px}
.stats{gap:10px}.stat{padding:16px}.stat strong{font-size:30px}
.split{grid-template-columns:1fr}
th,td{padding:14px}
}
@media(max-width:420px){.stats{grid-template-columns:1fr}.stat{display:flex;align-items:center;justify-content:space-between}.stat strong{margin:0}}
</style>
</head>
<body>
<header>
<div class="bar">
<h1>College Tracker</h1>
<nav aria-label="Sections">
<button data-tab="colleges" class="active">Colleges</button>
<button data-tab="tasks">Tasks</button>
<button data-tab="deadlines">Deadlines</button>
<button data-tab="scholarships">Scholarships</button>
</nav>
<button class="primary" id="add">+ Add college</button>
</div>
</header>
<main>
<div id="notice" role="status"></div>
<div class="stats" id="stats"></div>
<div id="view"></div>
<footer>
<button id="export" title="Download a backup of this browser's data">Export</button>
<button id="import" title="Restore a downloaded backup">Import</button>
<input type="file" id="backup" accept=".json,application/json" hidden>
</footer>
</main>
<dialog id="modal">
<form id="form">
<h2 id="form-title"></h2>
<div id="fields"></div>
<div class="actions">
<button type="button" id="cancel">Cancel</button>
<button class="primary" type="submit">Save</button>
</div>
</form>
</dialog>
<script>
const $=s=>document.querySelector(s);
const KEY="college-tracker-v2";
const OLD="abby-college-planner-v1";
const statuses=["Considering","Not started","In progress","Submitted","Accepted","Waitlisted","Denied","Enrolled"];
const scholarshipStatuses=["Not started","In progress","Submitted","Awarded","Not awarded"];
const categories=["Essay","Recommendation","Transcript","Test scores","Scholarship","Nomination","Interview","Financial aid","Other"];
let data={schools:[],tasks:[],scholarships:[]};
let tab="colleges",query="",filter="",editId=null,editType="",blocked=false;
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function today(){
const d=new Date();
return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateLabel(v){
if(!v)return "—";
const d=new Date(v+"T12:00:00");
return isNaN(d)?"—":d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function url(v){
try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:""}catch{return ""}
}
function submitted(s){return ["Submitted","Accepted","Waitlisted","Denied","Enrolled"].includes(s.status)}
function scholarshipDone(s){return ["Submitted","Awarded","Not awarded"].includes(s.status)}
function normalize(d){
if(!d||!Array.isArray(d.schools)||!Array.isArray(d.tasks))throw Error();
if(d.scholarships===undefined)d.scholarships=[];
if(!Array.isArray(d.scholarships))throw Error();
const all=[...d.schools,...d.tasks,...d.scholarships];
if(!all.every(x=>x&&typeof x.id==="string"))throw Error();
if(new Set(all.map(x=>x.id)).size!==all.length)throw Error();
for(const x of all){
for(const k of ["name","title","date","notes","major","url","schoolId","category","amount"]){
if(x[k]!=null&&typeof x[k]!=="string")throw Error();
}
if(x.date&&!/^\d{4}-\d{2}-\d{2}$/.test(x.date))throw Error();
}
if(!d.schools.every(x=>x.name&&statuses.includes(x.status)))throw Error();
if(!d.tasks.every(x=>x.title&&typeof x.done==="boolean"))throw Error();
if(!d.scholarships.every(x=>x.name&&scholarshipStatuses.includes(x.status)))throw Error();
return d;
}
try{
const raw=localStorage.getItem(KEY)||localStorage.getItem(OLD);
if(raw)data=normalize(JSON.parse(raw));
}catch{
blocked=true;
$("#notice").textContent="Saved data could not be loaded. Import a backup before editing.";
}
function save(){
try{localStorage.setItem(KEY,JSON.stringify(data));$("#notice").textContent=""}
catch{$("#notice").textContent="Changes could not be saved in this browser. Export a backup."}
render();
}
function due(){
return [
...data.schools.filter(s=>s.date&&!submitted(s)).map(s=>({id:s.id,type:"schools",name:s.name,date:s.date,label:"Application"})),
...data.tasks.filter(t=>t.date&&!t.done).map(t=>({id:t.id,type:"tasks",name:t.title,date:t.date,label:t.category||"Task"})),
...data.scholarships.filter(s=>s.date&&!scholarshipDone(s)).map(s=>({id:s.id,type:"scholarships",name:s.name,date:s.date,label:"Scholarship"}))
].sort((a,b)=>a.date.localeCompare(b.date));
}
function empty(text){return `<div class="empty">${text}</div>`}
function dateHtml(d,open=true){return `<span class="${d&&d<today()&&open?"late":""}">${dateLabel(d)}</span>`}
function buttons(type,id){
return `<div class="row"><button class="icon" data-edit="${esc(id)}" data-type="${type}">Edit</button><button class="icon" data-delete="${esc(id)}" data-type="${type}" aria-label="Delete record">×</button></div>`;
}
function taskList(items){
return items.length?`<div class="list">${items.map(t=>{
const s=data.schools.find(s=>s.id===t.schoolId);
return `<div class="item">
<input type="checkbox" data-check="${esc(t.id)}" ${t.done?"checked":""} aria-label="Complete ${esc(t.title)}">
<div class="grow"><span class="${t.done?"done":""}">${esc(t.title)}</span>
<small>${esc(t.category||"Other")}${s?" · "+esc(s.name):""}${t.date?" · "+dateHtml(t.date,!t.done):""}</small></div>
${buttons("tasks",t.id)}</div>`;
}).join("")}</div>`:empty("No tasks");
}
function deadlineList(items){
return items.length?`<div class="list">${items.map(d=>`<div class="item"><div class="grow">${esc(d.name)}<small>${esc(d.label)}</small></div>${dateHtml(d.date)}<button class="icon" data-edit="${esc(d.id)}" data-type="${d.type}">Edit</button></div>`).join("")}</div>`:empty("No deadlines");
}
function collegeRows(){
const list=data.schools.filter(s=>s.name.toLowerCase().includes(query.toLowerCase())&&(!filter||s.status===filter));
return list.length?list.map(s=>{
const tasks=data.tasks.filter(t=>t.schoolId===s.id);
const link=url(s.url);
return `<tr><td><span class="school">${esc(s.name)}</span>${s.major?`<small>${esc(s.major)}</small>`:""}</td>
<td>${dateHtml(s.date,!submitted(s))}</td><td><span class="badge">${esc(s.status)}</span></td>
<td>${tasks.filter(t=>t.done).length}/${tasks.length}</td>
<td>${link?`<a class="link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:"—"}</td>
<td>${buttons("schools",s.id)}</td></tr>`;
}).join(""):`<tr><td colspan="6">${empty(query||filter?"No matches":"No colleges added")}</td></tr>`;
}
function render(){
const deadlines=due();
$("#stats").innerHTML=[
[data.schools.length,"Colleges"],
[data.schools.filter(submitted).length,"Submitted"],
[deadlines.filter(d=>d.date>=today()).length,"Upcoming deadlines"]
].map(([n,l])=>`<div class="stat"><span>${l}</span><strong>${n}</strong></div>`).join("");
document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
$("#add").hidden=tab==="deadlines";
$("#add").textContent={colleges:"+ Add college",tasks:"+ Add task",scholarships:"+ Add scholarship"}[tab]||"";
if(tab==="colleges"){
$("#view").innerHTML=`<section class="panel">
<div class="toolbar"><input id="search" aria-label="Search colleges" placeholder="Search colleges" value="${esc(query)}">
<select id="filter" aria-label="Filter by status"><option value="">All statuses</option>${statuses.map(s=>`<option ${filter===s?"selected":""}>${s}</option>`).join("")}</select></div>
<div class="scroll"><table><thead><tr><th>College</th><th>Deadline</th><th>Status</th><th>Tasks</th><th>Portal</th><th aria-label="Actions"></th></tr></thead><tbody id="college-rows">${collegeRows()}</tbody></table></div></section>
<div class="split"><section class="panel"><div class="panelhead"><h2>Upcoming deadlines</h2></div>${deadlineList(deadlines.slice(0,5))}</section>
<section class="panel"><div class="panelhead"><h2>Tasks</h2><button data-new="tasks">+ Add task</button></div>${taskList(data.tasks.filter(t=>!t.done).slice(0,5))}</section></div>`;
$("#search").oninput=e=>{query=e.target.value;$("#college-rows").innerHTML=collegeRows()};
$("#filter").onchange=e=>{filter=e.target.value;$("#college-rows").innerHTML=collegeRows()};
}
if(tab==="tasks"){
const tasks=[...data.tasks].sort((a,b)=>Number(a.done)-Number(b.done)||(a.date||"9999").localeCompare(b.date||"9999"));
$("#view").innerHTML=`<section class="panel"><div class="panelhead"><h2>Tasks</h2></div>${taskList(tasks)}</section>`;
}
if(tab==="deadlines")$("#view").innerHTML=`<section class="panel"><div class="panelhead"><h2>Deadlines</h2></div>${deadlineList(deadlines)}</section>`;
if(tab==="scholarships"){
$("#view").innerHTML=`<section class="panel"><div class="scroll"><table><thead><tr><th>Scholarship</th><th>Amount</th><th>Deadline</th><th>Status</th><th>Link</th><th aria-label="Actions"></th></tr></thead><tbody>${data.scholarships.length?data.scholarships.map(s=>{
const link=url(s.url);
return `<tr><td class="school">${esc(s.name)}</td><td>${esc(s.amount||"—")}</td><td>${dateHtml(s.date,!scholarshipDone(s))}</td><td><span class="badge">${esc(s.status)}</span></td><td>${link?`<a class="link" href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:"—"}</td><td>${buttons("scholarships",s.id)}</td></tr>`;
}).join(""):`<tr><td colspan="6">${empty("No scholarships added")}</td></tr>`}</tbody></table></div></section>`;
}
}
function field(label,name,value="",type="text",required=false){
return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${required?"required":""}>`;
}
function choice(label,name,options,value){
return `<label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
}
function edit(type,id=null){
if(blocked)return;
editType=type;editId=id;
const x=data[type].find(x=>x.id===id)||{};
$("#form-title").textContent=(id?"Edit ":"Add ")+{schools:"college",tasks:"task",scholarships:"scholarship"}[type];
let html="";
if(type==="schools"){
html=field("College","name",x.name,"text",true)+field("Major","major",x.major)+choice("Status","status",statuses.map(s=>[s,s]),x.status||"Considering")+field("Deadline","date",x.date,"date")+field("Portal URL","url",x.url,"url");
}
if(type==="tasks"){
html=field("Task","title",x.title,"text",true)+choice("Category","category",categories.map(s=>[s,s]),x.category||"Essay")+choice("College","schoolId",[["","General"],...data.schools.map(s=>[s.id,s.name])],x.schoolId||"")+field("Deadline","date",x.date,"date");
}
if(type==="scholarships"){
html=field("Scholarship","name",x.name,"text",true)+field("Amount","amount",x.amount)+choice("Status","status",scholarshipStatuses.map(s=>[s,s]),x.status||"Not started")+field("Deadline","date",x.date,"date")+field("URL","url",x.url,"url");
}
$("#fields").innerHTML=html+`<label for="f-notes">Notes</label><textarea id="f-notes" name="notes">${esc(x.notes||"")}</textarea>`;
$("#modal").showModal();
}
$("#form").onsubmit=e=>{
e.preventDefault();
const values=Object.fromEntries(new FormData(e.target));
const nameField=editType==="tasks"?"title":"name";
values[nameField]=values[nameField].trim();
if(!values[nameField]){alert("Enter a name.");return}
if(values.url&&!url(values.url)){alert("Use an https:// or http:// link.");return}
const list=data[editType];
if(editId){
const i=list.findIndex(x=>x.id===editId);
list[i]={...list[i],...values};
}else{
list.push({id:crypto.randomUUID(),...values,...(editType==="tasks"?{done:false}:{})});
}
save();$("#modal").close();
};
$("#cancel").onclick=()=>$("#modal").close();
$("#add").onclick=()=>edit({colleges:"schools",tasks:"tasks",scholarships:"scholarships"}[tab]);
document.addEventListener("click",e=>{
const b=e.target.closest("button");
if(!b)return;
if(b.dataset.tab){tab=b.dataset.tab;render()}
if(b.dataset.new)edit(b.dataset.new);
if(b.dataset.edit)edit(b.dataset.type,b.dataset.edit);
if(b.dataset.delete&&!blocked){
const type=b.dataset.type,id=b.dataset.delete;
if(confirm(type==="schools"?"Delete this college? Its tasks will remain under General.":"Delete this item?")){
data[type]=data[type].filter(x=>x.id!==id);
if(type==="schools")data.tasks.forEach(t=>{if(t.schoolId===id)t.schoolId=""});
save();
}
}
});
document.addEventListener("change",e=>{
if(e.target.dataset.check&&!blocked){
const t=data.tasks.find(t=>t.id===e.target.dataset.check);
if(t){t.done=e.target.checked;save()}
}
});
$("#export").onclick=()=>{
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const u=URL.createObjectURL(blob),a=document.createElement("a");
a.href=u;a.download=`college-tracker-${today()}.json`;a.click();
setTimeout(()=>URL.revokeObjectURL(u),1000);
};
$("#import").onclick=()=>$("#backup").click();
$("#backup").onchange=async e=>{
const file=e.target.files[0];if(!file)return;
try{
const restored=normalize(JSON.parse(await file.text()));
if(confirm("Replace current data with this backup?")){
data=restored;blocked=false;save();
}
}catch{alert("Invalid backup file.")}
e.target.value="";
};
render();
</script>
</body>
</html>
